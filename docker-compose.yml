name: opspulse-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opspulse}
      POSTGRES_USER: ${POSTGRES_USER:-opspulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-opspulse}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-opspulse}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-opspulse}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

volumes:
  postgres-data:
