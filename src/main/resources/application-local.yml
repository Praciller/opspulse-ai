spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opspulse}
    username: ${SPRING_DATASOURCE_USERNAME:opspulse}
    password: ${SPRING_DATASOURCE_PASSWORD:opspulse}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/demo
    validate-migration-naming: true

opspulse:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoint:
    health:
      show-details: always
