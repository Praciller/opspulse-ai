spring:
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/demo
    validate-migration-naming: true

opspulse:
  cors:
    allowed-origins: http://localhost
  security:
    jwt:
      secret: test-only-jwt-secret-with-at-least-32-characters
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
    bcrypt-strength: 4
    registration-mode: ADMIN_ONLY

management:
  endpoint:
    health:
      show-details: never
